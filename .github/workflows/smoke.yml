name: Smoke test (live URL)
# Verifies a deployed instance end to end: the page and app bundle load, the API is healthy, a real script is
# generated from a real product page, and the Word/HTML exports work. Every check is logged to diag.txt, which
# the last step saves (with the generated script) to the "smoke-results" branch for review.
# Run it from the Actions tab, or: gh workflow run smoke.yml -f url=...
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Deployed app URL, e.g. https://scriptstudio.onrender.com"
        required: true
      product_url:
        description: "A public product page to generate from"
        default: "https://www.allbirds.com/products/mens-tree-runners"
      generate:
        description: "Run a full generation (uses one script of AI quota)"
        type: boolean
        default: true

permissions:
  contents: write   # the last step saves raw results to the "smoke-results" branch

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCT: ${{ inputs.product_url }}
      UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
    steps:
      - name: Site loads
        run: |
          BASE="${{ inputs.url }}"; BASE="${BASE%/}"; echo "BASE=$BASE" >> "$GITHUB_ENV"
          mkdir -p out; fail=0
          log() { echo "$*" | tee -a out/diag.txt; }
          check() {  # check <label> <path> <grep-pattern> [curl args...]
            local label=$1 path=$2 pat=$3; shift 3
            local info; info=$(curl -sS -m 90 -A "$UA" -c jar -b jar -o "out/$label" -w "%{http_code} %{content_type} %{size_download}B %{time_total}s" "$@" "$BASE$path" 2>&1)
            if [[ "$info" == 200* ]] && grep -q -- "$pat" "out/$label"; then log "PASS $label $path -> $info"; else log "FAIL $label $path -> $info"; fail=1; fi
          }
          for i in $(seq 1 12); do curl -fsS -m 30 "$BASE/api/health" >/dev/null && break || sleep 10; done   # wake a sleeping instance
          check index / 'id="root"'
          asset=$(grep -oE '/assets/[^"]+\.js' out/index | head -1)
          check bundle "$asset" 'createRoot\|React\|jsx'
          check health /api/health '"ok":true'
          check config /api/config '"auth_mode"'
          check options /api/options '"platforms"'
          check new_route /new 'id="root"'
          if grep -q '"demo_mode":true' out/config; then log "WARN instance is in demo mode (no AI model)"; fi
          exit $fail

      - name: Generate a script from a real product page
        if: ${{ inputs.generate }}
        run: |
          log() { echo "$*" | tee -a out/diag.txt; }
          BODY=$(jq -n --arg u "$PRODUCT" '{product_url:$u, platform:"instagram_reels", duration_sec:30,
            client_brief:"Launch a 30-second Reel for first-time buyers who want everyday comfort. Objective: drive first purchase. Tone: warm, witty, honest. CTA: shop now."}')
          resp=$(curl -sS -m 90 -A "$UA" -c jar -b jar -H "X-Requested-With: scriptwright" -H "Content-Type: application/json" \
                 -X POST "$BASE/api/jobs" -d "$BODY" -w "\n%{http_code}")
          code=$(tail -n1 <<<"$resp"); json=$(sed '$d' <<<"$resp")
          log "CREATE -> $code $json"
          ID=$(jq -r '.id // empty' <<<"$json"); [ -n "$ID" ] || exit 1
          echo "JOB=$ID" >> "$GITHUB_ENV"
          start=$(date +%s); last=""
          while true; do
            J=$(curl -sS -m 90 -A "$UA" -c jar -b jar "$BASE/api/jobs/$ID")
            S=$(jq -r .status <<<"$J"); L=$(jq -r '.events[-1] | "\(.stage) \(.status) \(.detail)"' <<<"$J")
            [ "$L" != "$last" ] && log "[$(( $(date +%s) - start ))s] $S — $L"; last=$L
            case "$S" in ready|needs_review|approved|failed) break;; esac
            [ $(( $(date +%s) - start )) -gt 1380 ] && { log "TIMEOUT waiting for job"; break; }
            sleep 10
          done
          echo "$J" > out/job.json
          jq '{status, error, title: .script.title, scenes: (.script.scenes | length), facts_verified: ([.dossier.facts[]? | select(.verified)] | length),
               flags: [.flags[] | select(.severity != "info") | .message], qc: .qc_history[-1].scores, passed: .qc_history[-1].passed}' out/job.json | tee out/result.json | tee -a out/diag.txt
          [[ "$S" =~ ^(ready|needs_review)$ ]]

      - name: Exports work
        if: ${{ inputs.generate }}
        run: |
          log() { echo "$*" | tee -a out/diag.txt; }; fail=0
          for kind in preview docx download; do
            info=$(curl -sS -m 90 -A "$UA" -c jar -b jar -o "out/export.$kind" -w "%{http_code} %{content_type} %{size_download}B" "$BASE/api/jobs/$JOB/$kind")
            [[ "$info" == 200* ]] && log "PASS export $kind -> $info" || { log "FAIL export $kind -> $info"; fail=1; }
          done
          { echo "### ✅ $BASE is live and working"; echo '```json'; cat out/result.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $fail

      - name: Save results to the smoke-results branch
        if: always()
        run: |
          cd out 2>/dev/null || exit 0
          for f in index bundle; do [ -f "$f" ] && head -c 2000 "$f" > "$f.head" && rm "$f"; done
          echo "run ${{ github.run_id }} at $(date -u) for ${{ inputs.url }}" > RUN.txt
          git init -q && git checkout -q -b smoke-results && git add -A
          git -c user.name=smoke -c user.email=smoke@users.noreply.github.com commit -qm "smoke ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke-results
