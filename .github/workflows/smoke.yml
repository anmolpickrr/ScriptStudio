name: Smoke test (live URL)
# Verifies a deployed instance end to end: the page and app bundle load, the API is healthy, a real script is
# generated from a real product page, and the Word/HTML exports work. Every check is logged to diag.txt, which
# the last step saves (with the generated script) to the "smoke-results" branch for review.
# Run it from the Actions tab, or: gh workflow run smoke.yml -f url=...
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Deployed app URL, e.g. https://scriptstudio.onrender.com"
        required: true
      product_url:
        description: "A public product page to generate from"
        default: "https://www.allbirds.com/products/mens-tree-runners"
      generate:
        description: "Run a full generation (uses one script of AI quota)"
        type: boolean
        default: true

permissions:
  contents: write   # the last step saves raw results to the "smoke-results" branch

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCT: ${{ inputs.product_url }}
      UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
    steps:
      - uses: actions/checkout@v5
      - name: Site loads
        run: |
          BASE="${{ inputs.url }}"; BASE="${BASE%/}"; echo "BASE=$BASE" >> "$GITHUB_ENV"
          mkdir -p out; fail=0
          log() { echo "$*" | tee -a out/diag.txt; }
          check() {  # check <label> <path> <grep-pattern> [curl args...]
            local label=$1 path=$2 pat=$3; shift 3
            local info; info=$(curl -sS -m 90 -A "$UA" -c jar -b jar -o "out/$label" -w "%{http_code} %{content_type} %{size_download}B %{time_total}s" "$@" "$BASE$path" 2>&1)
            if [[ "$info" == 200* ]] && grep -q -- "$pat" "out/$label"; then log "PASS $label $path -> $info"; else log "FAIL $label $path -> $info"; fail=1; fi
          }
          for i in $(seq 1 12); do curl -fsS -m 30 "$BASE/api/health" >/dev/null && break || sleep 10; done   # wake a sleeping instance
          check index / 'id="root"'
          asset=$(grep -oE '/assets/[^"]+\.js' out/index | head -1)
          check bundle "$asset" 'createRoot\|React\|jsx'
          check health /api/health '"ok":true'
          check config /api/config '"auth_mode"'
          check deep_health /api/health/deep '"db":"ok"'
          log "deep_health: $(cat out/deep_health 2>/dev/null)"
          check options /api/options '"platforms"'
          check new_route /new 'id="root"'
          if grep -q '"demo_mode":true' out/config; then log "WARN instance is in demo mode (no AI model)"; fi
          exit $fail

      - name: GitHub Pages website reaches the API
        if: always()
        run: |
          log() { echo "$*" | tee -a out/diag.txt; }; fail=0
          SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          ORIGIN="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          code=$(curl -sS -m 60 -o out/pages.html -w "%{http_code}" "$SITE")
          js=$(grep -oE 'assets/[^"]+\.js' out/pages.html | head -1)
          [[ "$code" == 200 && -n "$js" ]] && log "PASS pages site $SITE -> $code" || { log "FAIL pages site $SITE -> $code"; fail=1; }
          curl -sS -m 60 -o out/pages.js "$SITE$js" && grep -q -- "$BASE" out/pages.js && log "PASS pages bundle points at $BASE" || { log "FAIL pages bundle does not use $BASE"; fail=1; }
          log "INFO pages serves $js (latest-features marker: $(grep -c 'Copy request' out/pages.js || true))"
          deep=$(curl -sS -m 60 -o out/deep.html -w "%{http_code}" "${SITE}scripts"); grep -q 'id="root"' out/deep.html && log "PASS pages deep link (status $deep)" || { log "FAIL pages deep link"; fail=1; }
          allow=$(curl -sS -m 60 -o /dev/null -D - -X OPTIONS "$BASE/api/jobs" -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: POST" \
                  -H "Access-Control-Request-Headers: content-type,x-requested-with,x-session-token" | tr -d '\r' | grep -i '^access-control-allow-origin:' || true)
          [[ "$allow" == *"$ORIGIN"* ]] && log "PASS API allows $ORIGIN" || { log "FAIL API does not allow $ORIGIN yet (redeploy the API)"; fail=1; }
          tok=$(curl -sS -m 60 -D - -o /dev/null -H "Origin: $ORIGIN" "$BASE/api/config" | tr -d '\r' | grep -i '^x-session-token:' | cut -d' ' -f2)
          [[ -n "$tok" ]] && log "PASS API issues header session" || { log "FAIL API issues no header session"; fail=1; }
          exit $fail

      - name: Claude connector and ChatGPT Action respond
        if: always()
        run: |
          log() { echo "$*" | tee -a out/diag.txt; }; fail=0
          init=$(curl -sS -m 60 -X POST "$BASE/mcp" -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke"}}}')
          echo "$init" | grep -q '"ScriptStudio"' && log "PASS mcp initialize" || { log "FAIL mcp initialize: ${init:0:200}"; fail=1; }
          tools=$(curl -sS -m 60 -X POST "$BASE/mcp" -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
          echo "$tools" | grep -q submit_script && log "PASS mcp tools/list" || { log "FAIL mcp tools/list: ${tools:0:200}"; fail=1; }
          code=$(curl -sS -m 60 -o /dev/null -w "%{http_code}" "$BASE/.well-known/oauth-protected-resource")
          [[ "$code" == 404 ]] && log "PASS no OAuth required (404)" || { log "FAIL oauth discovery -> $code"; fail=1; }
          curl -sS -m 60 "$BASE/connect/openapi.json" | grep -q submitScript && log "PASS GPT action schema" || { log "FAIL GPT action schema"; fail=1; }
          exit $fail

      - name: Generate a script from a real product page
        if: ${{ inputs.generate }}
        run: |
          log() { echo "$*" | tee -a out/diag.txt; }
          BODY=$(jq -n --arg u "$PRODUCT" '{product_url:$u, platform:"instagram_reels", duration_sec:30,
            client_brief:"Launch a 30-second Reel for first-time buyers who want everyday comfort. Objective: drive first purchase. Tone: warm, witty, honest. CTA: shop now."}')
          resp=$(curl -sS -m 90 -A "$UA" -c jar -b jar -H "X-Requested-With: scriptwright" -H "Content-Type: application/json" \
                 -X POST "$BASE/api/jobs" -d "$BODY" -w "\n%{http_code}")
          code=$(tail -n1 <<<"$resp"); json=$(sed '$d' <<<"$resp")
          log "CREATE -> $code $json"
          ID=$(jq -r '.id // empty' <<<"$json"); [ -n "$ID" ] || exit 1
          echo "JOB=$ID" >> "$GITHUB_ENV"
          start=$(date +%s); last=""
          while true; do
            J=$(curl -sS -m 90 -A "$UA" -c jar -b jar "$BASE/api/jobs/$ID")
            S=$(jq -r .status <<<"$J"); L=$(jq -r '.events[-1] | "\(.stage) \(.status) \(.detail)"' <<<"$J")
            [ "$L" != "$last" ] && log "[$(( $(date +%s) - start ))s] $S — $L"; last=$L
            case "$S" in ready|needs_review|approved|failed) break;; esac
            [ $(( $(date +%s) - start )) -gt 1380 ] && { log "TIMEOUT waiting for job"; break; }
            sleep 10
          done
          echo "$J" > out/job.json
          jq '{status, error, title: .script.title, scenes: (.script.scenes | length), facts_verified: ([.dossier.facts[]? | select(.verified)] | length),
               flags: [.flags[] | select(.severity != "info") | .message], qc: .qc_history[-1].scores, passed: .qc_history[-1].passed}' out/job.json | tee out/result.json | tee -a out/diag.txt
          [[ "$S" =~ ^(ready|needs_review)$ ]]

      - name: Exports work
        if: ${{ inputs.generate }}
        run: |
          log() { echo "$*" | tee -a out/diag.txt; }; fail=0
          for kind in preview docx download; do
            info=$(curl -sS -m 90 -A "$UA" -c jar -b jar -o "out/export.$kind" -w "%{http_code} %{content_type} %{size_download}B" "$BASE/api/jobs/$JOB/$kind")
            [[ "$info" == 200* ]] && log "PASS export $kind -> $info" || { log "FAIL export $kind -> $info"; fail=1; }
          done
          { echo "### ✅ $BASE is live and working"; echo '```json'; cat out/result.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $fail

      - name: ChatGPT / Claude copy-paste flow
        if: always()
        run: |
          log() { echo "$*" | tee -a out/diag.txt; }; fail=0
          H=(-A "$UA" -c jar -b jar -H "X-Requested-With: scriptwright" -H "Content-Type: application/json")
          BODY=$(jq -n --arg u "$PRODUCT" '{product_url:$u, engine:"claude", platform:"instagram_reels", duration_sec:30,
            client_brief:"Launch a 30-second Reel for first-time buyers who want everyday comfort. Drive first purchase.",
            product_copy:"Tree Runners for men. Breathable, lightweight sneakers made with eucalyptus tree fiber. Machine washable."}')
          ID=$(curl -sS -m 90 "${H[@]}" -X POST "$BASE/api/jobs" -d "$BODY" | jq -r '.id // empty')
          for i in $(seq 1 30); do S=$(curl -sS -m 60 -A "$UA" -c jar -b jar "$BASE/api/jobs/$ID" | jq -r .status); [[ "$S" =~ ^(queued|running)$ ]] || break; sleep 3; done
          J=$(curl -sS -m 60 -A "$UA" -c jar -b jar "$BASE/api/jobs/$ID")
          P=$(jq -r '.relay.prompt // ""' <<<"$J" | wc -c)
          [[ "$S" == "awaiting_input" && $P -gt 3000 ]] && log "PASS relay prompt ready ($P chars)" || { log "FAIL relay status=$S prompt=$P $(jq -c '.error' <<<"$J")"; fail=1; }
          ANSWER=$(jq -n --rawfile a .github/smoke/relay_answer.json '{answer: $a}')
          code=$(curl -sS -m 90 "${H[@]}" -o out/relay.json -w "%{http_code}" -X POST "$BASE/api/jobs/$ID/relay" -d "$ANSWER")
          J=$(curl -sS -m 60 -A "$UA" -c jar -b jar "$BASE/api/jobs/$ID")
          log "relay answer -> $code status=$(jq -r .status <<<"$J") title=$(jq -r '.script.title' <<<"$J")"
          [[ "$code" == 200 ]] || fail=1
          dx=$(curl -sS -m 90 -A "$UA" -c jar -b jar -o out/relay.docx -w "%{http_code} %{content_type}" "$BASE/api/jobs/$ID/docx")
          log "relay docx -> $dx"
          exit $fail

      - name: Save results to the smoke-results branch
        if: always()
        run: |
          cd out 2>/dev/null || exit 0
          for f in index bundle; do [ -f "$f" ] && head -c 2000 "$f" > "$f.head" && rm "$f"; done
          echo "run ${{ github.run_id }} at $(date -u) for ${{ inputs.url }}" > RUN.txt
          git init -q && git checkout -q -b smoke-results && git add -A
          git -c user.name=smoke -c user.email=smoke@users.noreply.github.com commit -qm "smoke ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke-results
