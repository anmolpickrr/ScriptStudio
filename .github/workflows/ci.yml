name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t scriptstudio:ci .
      - name: Container end-to-end (demo AI, real product page, mounted data disk)
        run: |
          set -euo pipefail
          docker volume create data
          docker run -d --name app -p 8080:8080 -v data:/data \
            -e LLM_PROVIDER=demo -e AUTH_MODE=anonymous -e STORE_BACKEND=local -e LOCAL_STORE_DIR=/data \
            -e SESSION_SECRET=ci-secret scriptstudio:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health && break || sleep 1; done
          B=http://localhost:8080; C=(-c jar -b jar); H=(-H "X-Requested-With: scriptwright" -H "Content-Type: application/json")
          curl -fsS $B/ | grep -q '<div id="root">'
          curl -fsS "${C[@]}" $B/api/config | jq -e '.user.guest == true'
          ID=$(curl -fsS "${C[@]}" "${H[@]}" -X POST $B/api/jobs -d '{"product_url":"https://www.allbirds.com/products/mens-tree-runners","client_brief":"Launch a 30 second Reel that drives first purchase among commuters.","product_copy":"Lightweight everyday sneaker. Breathable eucalyptus tree fiber upper. Machine washable. Cushioned midsole for all-day comfort.","platform":"instagram_reels","duration_sec":30}' | jq -r .id)
          for i in $(seq 1 60); do S=$(curl -fsS "${C[@]}" $B/api/jobs/$ID | jq -r .status); echo "$S"; [[ "$S" =~ ^(queued|running)$ ]] || break; sleep 2; done
          curl -fsS "${C[@]}" $B/api/jobs/$ID | jq '{status, error, title: .script.title, facts: (.dossier.facts | length)}'
          [[ "$S" =~ ^(ready|needs_review)$ ]]
          curl -fsS "${C[@]}" -o s.docx -w "%{content_type}\n" $B/api/jobs/$ID/docx | grep -q wordprocessingml
          docker restart app && sleep 4
          curl -fsS "${C[@]}" $B/api/jobs/$ID | jq -e '.status != null' >/dev/null && echo "✓ data survives restart"
      - if: failure()
        run: docker logs app || true
