    <script>
      /* Day theme between sunrise and sunset in India, Night after dark (as in the Creative Ops Tracker); a manual
         choice holds until the light next changes. Runs before paint so there's no flash. */
      (function () {
        var SUN = [[430, 1060], [418, 1085], [393, 1105], [362, 1123], [338, 1140], [327, 1155], [335, 1155], [352, 1135], [368, 1102], [383, 1068], [403, 1040], [423, 1040]];
        var p = {};
        try { new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kolkata', month: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; }); } catch (e) {}
        var s = SUN[(+p.month || 1) - 1], mins = +p.hour * 60 + +p.minute, t = mins >= s[0] && mins < s[1] ? 'light' : 'dark';
        try { var o = localStorage.getItem('ss:theme'), u = +localStorage.getItem('ss:themeUntil') || 0; if (o && u && Date.now() < u) t = o; } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
