# One-click deploy on Render's FREE plan:
#   https://render.com/deploy?repo=https://github.com/anmolpickrr/ScriptStudio
# Render asks for three values (see docs/DEPLOYMENT.md):
#   GEMINI_API_KEY  – free key from https://aistudio.google.com/apikey (no card)
#   DATABASE_URL    – free Postgres connection string from https://neon.tech (no card)
#   ADMIN_PASSCODE  – any password you choose; unlocks house-format editing in the app
services:
  - type: web
    name: scriptstudio
    runtime: docker
    plan: free               # free instances sleep after 15 min idle; the keep-alive workflow can prevent that
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true         # every push to main redeploys
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSCODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini        # free tier; switch to "openai" + OPENAI_API_KEY for paid OpenAI models
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: anonymous     # open link, private workspace per browser
      - key: DAILY_JOB_LIMIT
        value: "5"           # per browser per day
      - key: GLOBAL_DAILY_LIMIT
        value: "20"          # whole app per day — keeps usage inside Gemini's free daily quota
      - key: MAX_CONCURRENT_JOBS
        value: "2"
